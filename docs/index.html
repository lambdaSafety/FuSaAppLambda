<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg?v=local">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 안전분석 공업 수학</title>
  <link rel="stylesheet" href="./workspace.css?v=project-save">
  <link rel="stylesheet" href="./expo-calculator.css?v=local">
  <link rel="stylesheet" href="./sysml-canvas.css?v=local">
  <link rel="stylesheet" href="./sysml-workspace.css?v=local">
  <script id="ft-math-renderer" async src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"
    integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
  <style>
    :root { font-family: system-ui, "Malgun Gothic", sans-serif; color: #152c3c; background: #edf3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .login-view { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .login-card { width: min(100%, 28rem); background: white; border: 1px solid #cbd9df; border-top: 5px solid #076960; border-radius: 1rem; padding: clamp(1.25rem, 6vw, 2.5rem); }
    .login-card header p { color: #076960; font-weight: 700; margin: 0 0 .5rem; }
    .login-card h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
    .login-card form { display: grid; gap: 1rem; }
    .login-card label { display: grid; gap: .375rem; font-weight: 600; }
    .login-card :is(input, button) { width: 100%; min-height: 3rem; font: inherit; border-radius: .5rem; padding: .625rem .75rem; }
    .login-card input { border: 1px solid #8199a6; color: inherit; background: white; }
    .login-card button { border: 1px solid transparent; background: #076960; color: white; font-weight: 700; cursor: pointer; }
    .login-card button:hover { background: #05554e; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #087cc3; outline-offset: 3px; }
    #error { color: #a12628; margin: 1rem 0 0; }
    :is(#error, #workspace-error):empty { display: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div id="login-view" class="login-view">
    <main class="login-card">
      <header>
        <p>안전분석 공업 수학</p>
        <h1>로그인</h1>
      </header>
      <form id="login">
        <label for="email">이메일
          <input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label for="password">비밀번호
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="submit" type="submit" disabled>연결 중…</button>
      </form>
      <p id="error" role="alert"></p>
    </main>
  </div>
  <div id="workspace" class="workspace" hidden>
    <header class="workspace-header">
      <div class="workspace-brand">
        <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">메뉴</button>
        <span>안전분석 공업 수학</span>
      </div>
      <div class="workspace-account">
        <span id="account"></span>
        <span id="project-save-status" class="project-save-status" role="status" hidden></span>
        <button id="save-project" type="button" disabled>Supabase 저장</button>
        <button id="logout" type="button">로그아웃</button>
      </div>
    </header>
    <aside id="sidebar" class="sidebar">
      <nav id="module-nav" aria-label="작업공간 메뉴"></nav>
    </aside>
    <main class="workspace-main">
      <div class="workspace-toolbar">
        <p id="location" class="workspace-location"></p>
        <button id="back" type="button" title="뒤로가기 (Ctrl+Z)" disabled>뒤로가기</button>
      </div>
      <p id="workspace-error" role="alert"></p>
      <section class="module-panel" aria-labelledby="module-title">
        <h1 id="module-title" tabindex="-1"></h1>
        <p id="module-description" class="module-description"></p>
        <div id="module-content"></div>
      </section>
    </main>
  </div>
  <script src="./expo-model.js?v=local"></script>
  <script src="./expo-chart.js?v=local"></script>
  <script src="./expo-calculator.js?v=frequency-formula"></script>
  <script src="./ft-event-model.js?v=local"></script>
  <script src="./ft-event-calculator.js?v=frequency-formula"></script>
  <script src="./repair-integrals-model.js?v=local"></script>
  <script src="./repair-integrals-calculator.js?v=local"></script>
  <script src="./failure-intensity-model.js?v=local"></script>
  <script src="./pfd-pfh-model.js?v=local"></script>
  <script src="./pfd-pfh-calculator.js?v=local"></script>
  <script src="./mean-failure-times-model.js?v=local"></script>
  <script src="./mean-failure-times-calculator.js?v=local"></script>
  <script src="./failure-intensity-calculator.js?v=local"></script>
  <link rel="stylesheet" href="./markov-editor.css?v=local">
  <script src="./markov-model.js?v=local"></script>
  <script src="./markov-analysis.js?v=local"></script>
  <script src="./req-model.js?v=project-save"></script>
  <script src="./sysml-model.js?v=fta-probability-models"></script>
  <script src="./sysml-projects.js?v=fta-save-state"></script>
  <script src="./sysml-canvas.js?v=local"></script>
  <script src="./sysml-editor.js?v=local"></script>
  <link rel="stylesheet" href="./fta-editor.css?v=fta-probability-models">
  <script src="./fta-analysis.js?v=fta-probability-models"></script>
  <script src="./fta-editor.js?v=fta-probability-models"></script>
  <link rel="stylesheet" href="./req-editor.css?v=local">
  <script src="./req-if.js?v=local"></script>
  <script src="./req-editor.js?v=project-save"></script>
  <script src="./markov-editor.js?v=local"></script>
  <script src="./sysml-workspace.js?v=fta-save-state"></script>
  <script src="./fmea-worksheet.js?v=project-save"></script>
  <script src="./monte-carlo-plots.js?v=local"></script>
  <script src="./monte-carlo.js?v=local"></script>
  <script src="./distribution-model.js?v=local"></script>
  <script src="./distribution-count.js?v=local"></script>
  <script src="./distribution-life.js?v=local"></script>
  <script src="./distribution-lab.js?v=local"></script>
  <script src="./learning-labs.js?v=local"></script>
  <script src="./risk-tables.js?v=local"></script>
  <script src="./mission-profile.js?v=project-save"></script><script src="./workspace.js?v=project-save"></script>
  <script>
    const loginView = document.querySelector('#login-view');
    const workspaceView = document.querySelector('#workspace');
    const workspace = createWorkspace(workspaceView);
    const form = document.querySelector('#login');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const error = document.querySelector('#error');
    const submit = document.querySelector('#submit');
    const logout = document.querySelector('#logout');
    const account = document.querySelector('#account');
    const workspaceError = document.querySelector('#workspace-error');
    let signedInUserId = null;

    function renderSession(client, session) {
      const user = session?.user;
      const previousUserId = signedInUserId;
      signedInUserId = user?.id ?? null;
      if (previousUserId && previousUserId !== signedInUserId) workspace.stop();
      loginView.hidden = Boolean(user);
      workspaceView.hidden = !user;
      account.textContent = user?.email ?? '';
      account.title = account.textContent;
      if (user && user.id !== previousUserId) {
        workspaceError.textContent = '';
        setTimeout(() => {
          if (signedInUserId === user.id) workspace.start(client, user.id);
        }, 0);
      }
      if (!user && previousUserId) {
        document.title = '로그인 | 안전분석 공업 수학';
        form.reset();
        email.focus();
      }
    }

    form.addEventListener('input', () => {
      if (!submit.disabled) error.textContent = '';
    });

    async function connect() {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const client = createClient(
        'https://qdhvtpbdvaumaxfsophi.supabase.co',
        'sb_publishable_FRN-xKOni94iN5O6F1Flig_tPWrCtf7'
      );
      const { auth } = client;

      auth.onAuthStateChange((event, session) => {
        renderSession(client, session);
        if (event === 'INITIAL_SESSION') {
          submit.disabled = false;
          submit.textContent = '로그인';
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submit.disabled) return;
        submit.disabled = true;
        submit.textContent = '로그인 중…';
        error.textContent = '';
        try {
          const { error: failure } = await auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
          if (failure) throw failure;
          form.reset();
        } catch (failure) {
          const messages = {
            invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
            email_not_confirmed: '이메일을 확인한 뒤 다시 로그인하세요.'
          };
          error.textContent = messages[failure.code] ?? '로그인하지 못했습니다. 잠시 후 다시 시도하세요.';
          password.focus();
        } finally {
          submit.disabled = false;
          submit.textContent = '로그인';
        }
      });

      logout.addEventListener('click', async () => {
        logout.disabled = true;
        workspaceError.textContent = '';
        try {
          if (!await workspace.beforeLogout()) return;
          const { error: failure } = await auth.signOut({ scope: 'local' });
          if (failure) throw failure;
        } catch {
          workspaceError.textContent = '로그아웃하지 못했습니다. 잠시 후 다시 시도하세요.';
        } finally {
          logout.disabled = false;
        }
      });
    }

    connect().catch(() => {
      submit.textContent = '연결 실패';
      error.textContent = '로그인 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 페이지를 새로고침하세요.';
    });
  </script>
</body>
</html>
